<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: black;
            color: white;
            
        }
        .logo-titulo{
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 200px;
        }
        .logo-titulo img{
            width: 50px;
            height: 50px;
        }
        .logo-titulo h1{
            text-align: center;
           
        }
        p{
            text-align: center;
            font-size: 20px;
        }
        form{
            margin: 60px 30px 0 30px;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
        }
        input{
            background-color: rgb(92, 101, 90);
            padding: 10px;
            border-radius: 15px;
            border: none;
        }
        input::placeholder{
            color: white;
        }
        button{
            padding: 10px;
            border-radius: 15px;
            color: white;
            background-color: black;
        }
    </style>
    <title>Eclipse Entregas | O melhor delivery da cidade</title>
</head>
<body>
    <div class="logo-titulo">
        <img src="logo.png" alt="Logo Eclipse Entregas">
        <h1>Eclipse Entregas</h1> <br>
    </div>
    <p class="mensagem" id="mensagem""></p>
    <form id="formLogin">
        <legend>NAME</legend>
        <input type="text" name="name" id="nome" placeholder="Digite seu nome" required> <br>
        <legend>EMAIL</legend>
        <input type="email" name="email" id="email" placeholder="Digite seu email" required> <br>
        <legend>PASSWORD</legend>
        <input type="password" name="password" id="senha" placeholder="Digite sua senha" required> <br>
        <button type="submit" >Sign up</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
