<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Style - Login & Cadastro</title>

    <!-- Css principalda pagina -->
    <link rel="stylesheet" href="assets/index/index.css?V=1.0.0">

  <!-- ========================= -->
  <!-- FAVICONS -->
  <!-- ========================= -->
  <link rel="icon" type="image/png" sizes="192x192"
        href="https://qualidadesoftwareproz.netlify.app/favicons/joao_style_192x192.png">
  <link rel="icon" type="image/png" sizes="512x512"
        href="https://qualidadesoftwareproz.netlify.app/favicons/joao_style_512x512.png">
    
</head>
    <body>
        <main class="container">

            <h2>João Style</h2>
            
            <br>

            <section class="form-container">
                <form class="form" onsubmit="submitForm(); return false;">
                    <label for="name">Name</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <button id="submit-btn" type="submit" onclick="submitForm()">
                        Sign up
                    </button>


                    <div id="mensagem_error" class="error-message"> </div>

                    
                </form>
            </section>

        </main>
    </body>

    <!-- Link to the JavaScript file -->
    <script src="assets/index/index.js?V=1.0.0" defer></script>
</html>
